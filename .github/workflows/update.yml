# Runs the dashboard on a timer, publishes the page, remembers what it has seen,
# and opens a GitHub issue (which emails you) when PBS/SBP post something new.
# You do not need to change anything here.

name: Update dashboard

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes (UTC; GitHub may lag a little)
  workflow_dispatch:            # run-by-hand button
  push:
    branches: [ main ]
    paths-ignore:
      - 'state.json'            # ignore the memory file so saving it can't loop

permissions:
  contents: write               # to save state.json back to the repo
  issues: write                 # to open the alert issue
  pages: write
  id-token: write

concurrency:
  group: "dashboard"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Build the dashboard
        run: python main.py

      - name: Send alert if new PBS/SBP release
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "New PBS/SBP economic release" --body-file alert.md

      - name: Remember what was seen
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json
            git commit -m "update seen state"
            git push
          fi

      - name: Prepare the page
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
